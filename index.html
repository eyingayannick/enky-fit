  --bg:#0B1020;--bg2:#121A36;--card:#151E3E;--card2:#1C2752;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.12);
  --ink:#F3F6FF;--ink2:#A3AED2;--vio:#7C6CFF;--mint:#2DE2C4;--amber:#FFB547;--coral:#FF6B7A;
  --fig:#F3F6FF;--fig2:#7A86B2;--prop:rgba(163,174,210,.42);--shadow:0 14px 34px rgba(0,0,0,.38);
  --font:"SF Pro Rounded","Nunito","Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F3F5FF;--bg2:#E7EBFF;--card:#FFFFFF;--card2:#EEF0FF;--line:rgba(18,25,54,.08);--line2:rgba(18,25,54,.12);
  --ink:#121936;--ink2:#5A6591;--fig:#1A2350;--fig2:#8E97BC;--prop:rgba(90,101,145,.35);--shadow:0 14px 34px rgba(40,50,120,.14);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:500 16px/1.45 var(--font);background:radial-gradient(900px 420px at 50% -8%,rgba(124,108,255,.28),transparent 62%),var(--bg);min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:800;letter-spacing:-.015em;line-height:1.12}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 120px}

/* marque */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:#fff var(--logo) center/88% no-repeat;box-shadow:0 6px 18px rgba(124,108,255,.45);flex:none}
.logo svg{width:22px;height:22px}
.wm{font:800 22px var(--font);letter-spacing:-.02em}
.wm i{font-style:normal;background:linear-gradient(90deg,var(--vio),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.roundbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.roundbtn svg{width:20px;height:20px}
.sub{color:var(--ink2);font-size:14px;margin:-6px 0 14px}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:splashOut .5s ease 1.5s forwards}
#splash .logo{width:104px;height:104px;border-radius:30px;animation:bounceIn .9s cubic-bezier(.2,1.4,.4,1) both}
#splash .logo svg{width:48px;height:48px}
#splash .wm{font-size:34px;animation:rise .7s .25s both}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@keyframes bounceIn{0%{transform:scale(.3) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* jours */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:18px;border:1px solid transparent}
.day .dn{font-size:12px;color:var(--ink2);font-weight:600}
.day.sel{background:var(--card);border-color:var(--line2)}
.day.sel .dn{color:var(--ink)}
.day .rg{width:40px;height:40px}
.day.today .dn{color:var(--mint)}

/* héros */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:20px 18px 18px;margin-bottom:16px;color:#fff;background:linear-gradient(140deg,#5A49F5 0%,#7C6CFF 46%,#20CDB0 130%);box-shadow:var(--shadow);--fig:#fff;--fig2:rgba(255,255,255,.55);--prop:rgba(255,255,255,.4)}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-90px;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-30px,40px)}}
.hero-top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chip{display:inline-block;background:rgba(255,255,255,.18);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600;margin-bottom:8px}
.hero h1{font-size:34px}
.dur{text-align:right;flex:none}
.dur b{font:800 48px/1 var(--font);display:block;font-variant-numeric:tabular-nums}
.dur span{font-size:13px;opacity:.9}
.stage{position:relative;margin:6px -6px 2px;height:170px}
.stage .fig{position:absolute;inset:0;width:100%;height:100%}
.stage .fig.in{animation:figIn .5s ease both}
@keyframes figIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.cap{position:relative;text-align:center;font-weight:700;font-size:15px;min-height:22px;margin-bottom:12px}
.cta{position:relative;display:block;width:100%;min-height:56px;border-radius:99px;background:#fff;color:#2B1FA8;font:800 18px var(--font);box-shadow:0 10px 24px rgba(20,10,80,.3);transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.done-badge{display:flex;align-items:center;gap:10px;font:800 18px var(--font);margin-bottom:10px;position:relative}
.done-badge svg{width:28px;height:28px;padding:5px;border-radius:50%;background:var(--mint);color:#062B25}

/* listes d'exercices */
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.ex{display:grid;grid-template-columns:84px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:8px 14px 8px 8px;animation:rise .5s both}
.ex .mini{width:84px;height:62px;border-radius:16px;background:var(--card2);overflow:hidden}
.ex .mini .fig{width:100%;height:100%}
.ex b{display:block;font-weight:700;line-height:1.2}
.ex small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.pill{background:var(--card2);border-radius:99px;padding:5px 12px;font:800 14px var(--font);white-space:nowrap}
.dots{display:flex;gap:6px;margin-top:6px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center}
.dot.on{background:var(--mint);border-color:var(--mint);color:#062B25}
.dot svg{width:14px;height:14px;opacity:0}
.dot.on svg{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600}
.chips b{color:var(--mint);font-weight:800}

/* cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:16px;animation:rise .5s both}
.card h3{font-size:19px;margin-bottom:12px}
.card p.l{color:var(--ink2);font-size:14.5px}
.rg{display:block}
.rg .rb{fill:none;stroke:var(--line2)}
.rg .rf{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.rg text{fill:var(--ink);font-family:var(--font);font-weight:800}
.rg .rs{fill:var(--ink2);font-weight:600}
.bigring{display:flex;flex-direction:column;align-items:center;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.kpi{background:var(--card2);border-radius:18px;padding:12px 6px;text-align:center}
.kpi b{display:block;font:800 22px var(--font)}
.kpi span{font-size:12.5px;color:var(--ink2)}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.days7 span{display:block;font-size:12px;color:var(--ink2);margin-top:2px;font-weight:600}
.days7 .rg{margin:0 auto}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;text-align:center}
.weeks span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px;font-weight:600}
.weeks .rg{margin:0 auto}
.weeks .fut{opacity:.4}
.donut{display:flex;align-items:center;gap:18px}
.legend{display:flex;flex-direction:column;gap:10px;font-weight:600;font-size:14.5px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px}
.empty{color:var(--ink2);font-size:14px;text-align:center;margin-top:10px}

/* plan */
.wk{display:grid;grid-template-columns:82px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.wk:first-of-type{border-top:0}
.wk .d{font-weight:800}
.wk .s{color:var(--ink2);font-size:14px}
.wk .m{font-weight:800;color:var(--mint);font-variant-numeric:tabular-nums}
.wk.cur .d{color:var(--mint)}
.ph{padding:14px;border-radius:20px;margin-bottom:10px;background:var(--card2)}
.ph.cur{background:linear-gradient(135deg,rgba(124,108,255,.35),rgba(45,226,196,.22));border:1px solid var(--line2)}
.ph h4{margin:0 0 4px;font-size:17px;font-weight:800}
.ph p{color:var(--ink2);font-size:14px}
.tag{background:var(--mint);color:#062B25;border-radius:99px;padding:2px 10px;font-size:12px;margin-left:8px;font-weight:800;vertical-align:middle}
.planhead{display:flex;align-items:center;gap:16px}

/* conseils */
.alert{border:1.5px solid var(--coral);background:rgba(255,107,122,.09);border-radius:22px;padding:14px 16px;margin-bottom:16px}
.alert h3{font-size:18px;margin-bottom:4px}
.alert p{font-size:14.5px}
.zone{display:grid;grid-template-columns:16px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.zone:first-of-type{border-top:0}
.zone i{width:16px;height:16px;border-radius:50%;margin-top:4px}
.zone b{display:block}
.zone span{color:var(--ink2);font-size:14px}
.tips{margin:0;padding-left:20px;font-size:15px}
.tips li{margin:6px 0}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.sw{width:52px;height:30px;border-radius:99px;background:var(--card2);border:1px solid var(--line2);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--mint)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
input[type=text],input[type=date]{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);padding:0 14px;font:inherit}
.btn{min-height:44px;border-radius:99px;border:1.5px solid var(--line2);padding:0 18px;font-weight:700;background:var(--card2)}
.btn.warn{border-color:var(--coral);color:var(--coral)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
label.fld{display:block;color:var(--ink2);font-size:13.5px;margin:10px 0 6px}

/* onglets */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(456px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);box-shadow:var(--shadow);z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;border-radius:20px;font-size:12px;font-weight:700;color:var(--ink2);transition:background .25s,color .25s}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--vio),#5F8CFF);color:#fff}

/* figure */
.fig{display:block;overflow:visible}
.fig .gnd{stroke:var(--prop);stroke-width:3;stroke-linecap:round}
.fig .prop line,.fig .prop path{stroke:var(--prop);stroke-width:5;stroke-linecap:round;fill:none}
.fig .prop .fill{fill:var(--prop);stroke:none}
.fig .cable{stroke:var(--prop);stroke-width:2.5;stroke-linecap:round}
.fig .limb{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:7}
.fig .far{stroke:var(--fig2)}
.fig .near{stroke:var(--fig)}
.fig .torso{stroke:var(--fig);stroke-width:10;stroke-linecap:round}
.fig .head{fill:var(--fig)}

/* séance guidée */
.gd{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:radial-gradient(700px 420px at 50% 25%,rgba(124,108,255,.55),transparent 70%),linear-gradient(180deg,#141B45,#0B1020 80%);--fig:#fff;--fig2:rgba(255,255,255,.55);--prop:rgba(255,255,255,.4);--acc:var(--amber);transition:background .6s}
.gd[hidden]{display:none}
.gd[data-kind="rest"],.gd[data-kind="cool"]{background:radial-gradient(700px 420px at 50% 25%,rgba(45,226,196,.4),transparent 70%),linear-gradient(180deg,#0E2A3A,#0B1020 80%);--acc:var(--mint)}
.gd[data-kind="warm"]{background:radial-gradient(700px 420px at 50% 25%,rgba(95,140,255,.5),transparent 70%),linear-gradient(180deg,#132A5E,#0B1020 80%);--acc:#8FB4FF}
.gd-prog{display:flex;gap:3px;margin-bottom:10px}
.gd-prog i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden;position:relative}
.gd-prog i.on{background:var(--acc)}
.gd-bar{display:flex;justify-content:space-between;align-items:center}
.gd-bar .roundbtn{background:rgba(255,255,255,.12);border:0;color:#fff}
.gd-tools{display:flex;gap:8px}
.gd-tools .roundbtn[aria-pressed="false"]{opacity:.45}
.gd-count{font-weight:700;opacity:.85}
.gd-main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.gd-kind{font-weight:800;color:var(--acc);letter-spacing:.02em}
.gd-main h2{font-size:28px}
.gd-stage{width:100%;max-width:380px;height:min(30vh,210px);border-radius:32px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden}
.gd-stage .fig{position:absolute;inset:0;width:100%;height:100%}
.gd-stage.pulse{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 42px rgba(255,255,255,.18)}}
.clock{position:relative;width:132px;height:132px;flex:none}
.clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:9}
.clock .cb{stroke:rgba(255,255,255,.16)}
.clock .ca{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:0}
.clock-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#g-sec{font:800 44px/1 var(--font);font-variant-numeric:tabular-nums}
#g-unit{font-size:12.5px;opacity:.8}
.gd-msg{min-height:26px;font:800 19px var(--font);color:#fff;padding:0 8px}
.gd-msg.pop{animation:msgPop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes msgPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.gd-bot{display:flex;flex-direction:column;gap:12px}
#g-next{text-align:center;opacity:.85;font-size:14.5px;min-height:20px}
.gd-ctrl{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px}
.gd-ctrl button{min-height:56px;border-radius:99px;background:rgba(255,255,255,.13);font-weight:700}
.gd-ctrl .pp{background:#fff;color:#2B1FA8;font:800 18px var(--font)}
#g-manual{display:none;min-height:60px;border-radius:99px;background:#fff;color:#2B1FA8;font:800 20px var(--font)}
.gd.manual #g-manual{display:block}
.gd.manual .gd-ctrl .pp{visibility:hidden}
.gd.manual #g-sec{font-size:52px}
.gd-fin{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;position:relative}
.gd.fin .gd-main,.gd.fin .gd-bot,.gd.fin .gd-prog,.gd.fin .gd-bar .gd-count{display:none}
.gd.fin .gd-fin{display:flex}
.fin-ring{width:170px;height:170px}
.fin-ring circle{fill:none;stroke-width:12}
.fin-ring .fb{stroke:rgba(255,255,255,.16)}
.fin-ring .fa{stroke:url(#gA);stroke-linecap:round;stroke-dasharray:502;stroke-dashoffset:502;transform:rotate(-90deg);transform-origin:center;animation:finDraw 1.2s .2s cubic-bezier(.2,.8,.2,1) forwards}
.fin-ring path{fill:none;stroke:#fff;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90;animation:finDraw2 .6s 1s ease forwards}
@keyframes finDraw{to{stroke-dashoffset:0}}
@keyframes finDraw2{to{stroke-dashoffset:0}}
.gd-fin h2{font-size:34px;animation:rise .6s .4s both}
.gd-fin p{opacity:.9;animation:rise .6s .6s both}
.fin-kpis{display:flex;gap:10px;animation:rise .6s .8s both}
.fin-kpis div{background:rgba(255,255,255,.12);border-radius:18px;padding:10px 16px}
.fin-kpis b{display:block;font:800 22px var(--font)}
.fin-kpis span{font-size:12.5px;opacity:.85}
.fin-btns{display:grid;gap:10px;width:100%;max-width:340px;animation:rise .6s 1s both}
.fin-btns .cta.ghost{background:rgba(255,255,255,.14)}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.hero::before,.gd-stage.pulse{animation:none}}
</style>
</head>

<script>
(function(){

var $=function(id){return document.getElementById(id)};
var NS='http://www.w3.org/2000/svg';

/* ================= Stockage ================= */
var S=null;
try{var raw=localStorage.getItem('enkyfit:v1');if(raw)S=JSON.parse(raw);}catch(e){}
if(!S||typeof S!=='object')S={};

if(S.voice===undefined)S.voice=true;

if(S.name===undefined)S.name='Yannick';
function save(){try{localStorage.setItem('enkyfit:v1',JSON.stringify(S));}catch(e){}}

/* ================= Dates ================= */
var DAYS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var DS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
var MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var MS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function pad(n){return n<10?'0'+n:''+n}
function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function mid(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function diff(a,b){return Math.round((b-a)/864e5)}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function long(d){return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]}
function short(d){return d.getDate()+' '+MS[d.getMonth()]}
function fmt(m){if(m<60)return m+' min';var h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+pad(r):'')}
function info(date){var days=diff(parse(S.start),mid(date));var wk=days<0?0:Math.floor(days/7);return{days:days,wk:wk,ph:Math.min(3,Math.floor(wk/2)),before:days<0}}

/* ================= Personnage animé ================= */
/* image = [hx,hy,tronc, bras1(haut,bas), bras2(haut,bas), jambe1(cuisse,tibia), jambe2(cuisse,tibia)], angles en degrés (0 = droite, 90 = bas) */

 lunge:{d:4200,f:[[130,88,-90,0,0,0,0,90,90,90,90],[118,94.5,-88,0,0,0,0,50,100,100,130],[105,108,-80,0,0,0,0,15,90,110,165],[118,94.5,-88,0,0,0,0,50,100,100,130]]},

 wallpush:{d:3200,f:[[110,95,-60,-15,-15,-15,-15,120,120,120,120],[117.4,100.2,-50,40,-60,40,-60,130,130,130,130]],
  prop:'<rect class="fill" x="172" y="18" width="10" height="124" rx="4"/>'},
 superman:{d:3200,f:[[100,132,0,0,0,0,0,180,180,180,180],[100,130,-10,-25,-25,-20,-20,205,205,200,200]]},
 incline:{d:2600,f:[[102.6,110.2,-35,26,26,26,26,145,145,145,145],[102.6,107.6,-33,26,26,26,26,145,145,145,145]],
  prop:'<rect class="fill" x="158" y="104" width="48" height="7" rx="3"/><line x1="164" y1="111" x2="164" y2="141"/><line x1="200" y1="111" x2="200" y2="141"/>'},

function rad(a){return a*Math.PI/180}
function limb(o,a,b,l1,l2){var m=[o[0]+l1*Math.cos(rad(a)),o[1]+l1*Math.sin(rad(a))];return [o,m,[m[0]+l2*Math.cos(rad(b)),m[1]+l2*Math.sin(rad(b))]]}
function pts(l){return l[0][0].toFixed(1)+','+l[0][1].toFixed(1)+' '+l[1][0].toFixed(1)+','+l[1][1].toFixed(1)+' '+l[2][0].toFixed(1)+','+l[2][1].toFixed(1)}
function interp(fr,t,open,w){
  var n=fr.length,segs=open?n-1:n,i,tot=0,ws=w;
  if(!ws){ws=[];for(i=0;i<segs;i++)ws.push(1)}
  for(i=0;i<segs;i++)tot+=ws[i];
  var x=t*tot,acc=0,s=segs-1;
  for(i=0;i<segs;i++){if(x<acc+ws[i]){s=i;break}acc+=ws[i]}
  var f=(x-acc)/ws[s];if(f>1)f=1;if(f<0)f=0;
  function g(k){
    if(!open)return fr[((k%n)+n)%n];
    if(k<0){return fr[0].map(function(v,j){return 2*v-fr[1][j]})}
    if(k>n-1){return fr[n-1].map(function(v,j){return 2*v-fr[n-2][j]})}
    return fr[k];
  }
  var p0=g(s-1),p1=g(s),p2=g(s+1),p3=g(s+2),o=[],f2=f*f,f3=f2*f;
  for(var j=0;j<11;j++){o.push(0.5*((2*p1[j])+(-p0[j]+p2[j])*f+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*f2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*f3))}
  return o;
}

function draw(fg,now){

  var head=[neck[0]+14*Math.cos(T),neck[1]+14*Math.sin(T)];
  var a1=limb(neck,p[3],p[4],20,19),a2=limb(neck,p[5],p[6],20,19),l1=limb(hip,p[7],p[8],26,26),l2=limb(hip,p[9],p[10],26,26);

  R.head.setAttribute('cx',head[0].toFixed(1));R.head.setAttribute('cy',head[1].toFixed(1));
  R.a1.setAttribute('points',pts(a1));R.a2.setAttribute('points',pts(a2));R.l1.setAttribute('points',pts(l1));R.l2.setAttribute('points',pts(l2));
  if(R.cable&&P.cable){R.cable.setAttribute('x1',P.cable[0]);R.cable.setAttribute('y1',P.cable[1]);R.cable.setAttribute('x2',a1[2][0].toFixed(1));R.cable.setAttribute('y2',a1[2][1].toFixed(1))}

var AC=null,master=null,song=null,noiseBuf=null;
function ctx(){
  if(!S.sound)return null;
  try{
    if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*.1,AC.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
  return AC;
}
function tone(f,t,d,type,v,dest){
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05);
}
function kick(t,dest){var o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.2)}
function hat(t,dest,v){var s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(v||.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);s.connect(f);f.connect(g);g.connect(dest);s.start(t)}
var SND={
  start:function(){if(!ctx())return;var t=AC.currentTime;tone(523,t,.12,'triangle',.2);tone(784,t+.12,.2,'triangle',.2)},
  go:function(){if(!ctx())return;var t=AC.currentTime;tone(660,t,.1,'square',.09);tone(990,t+.1,.22,'square',.09)},
  tick:function(){if(!ctx())return;tone(720,AC.currentTime,.08,'sine',.16)},
  chime:function(){if(!ctx())return;var t=AC.currentTime;tone(659,t,.18,'triangle',.22);tone(880,t+.12,.2,'triangle',.22);tone(1175,t+.25,.35,'triangle',.22)},
  song:function(){
    if(!ctx())return;
    var t0=AC.currentTime+.15,bpm=126,b=60/bpm,sg=AC.createGain();sg.gain.value=.8;sg.connect(master);song=sg;
    var ch=[[261.63,329.63,392],[196,246.94,293.66],[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392]];
    var bs=[65.41,49,55,43.65,65.41];
    for(var bar=0;bar<5;bar++){
      var t=t0+bar*4*b;
      ch[bar].forEach(function(f){tone(f,t,4*b*.96,'triangle',.05,sg)});
      for(var k=0;k<8;k++){
        var f=ch[bar][k%3]*2*(k%4===3?1.5:1);
        tone(f,t+k*b/2,b/2*.85,'square',.045,sg);
        if(bar<4)tone(bs[bar]*(k%2?2:1),t+k*b/2,b/2*.9,'sawtooth',.06,sg);
      }
      for(var q=0;q<4;q++){if(bar<4){kick(t+q*b,sg);hat(t+q*b+b/2,sg)}}
    }
    var te=t0+16*b;
    [523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,te,1.8,'triangle',.09,sg);tone(f/2,te,1.8,'sine',.08,sg)});
    kick(te,sg);hat(te,sg,.14);
  },
  stopSong:function(){try{if(song){song.gain.cancelScheduledValues(AC.currentTime);song.gain.setValueAtTime(0,AC.currentTime);song=null}}catch(e){}}
};

function runGuide(steps,opts){
  if(G&&G.iv)clearInterval(G.iv);

function enter(i,first){
  G.i=i;var s=G.steps[i];
  G.total=(s.sec||0)*1000;G.rem=G.total;G.end=Date.now()+G.rem;G.fl={mid:false,last:false,nx:false};G.msgAt=4500;G.t0=Date.now();

    sayLater('Respire calmement.',1700);setMsg(pick(['Respire calmement','Bien joué, récupère','Épaules relâchées']));
  }else if(s.kind==='warm'){

function tick(){
  if(!G||G.paused||G.fin)return;
  var s=G.steps[G.i];
  if(s.manual){paint();return}
  var rem=G.end-Date.now();
  if(rem<=0){completeStep();return}
  G.rem=rem;
  var sec=Math.ceil(rem/1000),el=(G.total-rem);
  if(s.kind==='work'){
    if(!G.fl.mid&&G.total>=20000&&el>=G.total/2){G.fl.mid=true;say(pick(ENC_VOICE))}
    if(!G.fl.last&&G.total>=15000&&sec<=5&&G.total>12000&&G.fl.mid){G.fl.last=true;say(pick(LAST_VOICE))}
    if(el>=G.msgAt){G.msgAt+=5000;setMsg(pick(ENC_MSG))}
  }
  if(s.kind==='rest'&&!G.fl.nx&&rem<=4500&&G.total>=8000){G.fl.nx=true;var n=G.steps[G.i+1];if(n)say('Prépare-toi : '+n.label)}
  if(sec<=3&&sec!==G.lastSec){G.lastSec=sec;SND.tick()}

}
function confetti(){
  var c=$('g-conf'),cols=['#7C6CFF','#2DE2C4','#FFB547','#FF6B7A','#8FB4FF','#fff'],h='';
  for(var i=0;i<46;i++){h+='<i style="left:'+(Math.random()*100).toFixed(1)+'%;background:'+cols[i%cols.length]+';animation-duration:'+(2.6+Math.random()*2.4).toFixed(2)+'s;animation-delay:'+(Math.random()*1.4).toFixed(2)+'s;transform:rotate('+Math.floor(Math.random()*360)+'deg)"></i>'}
  c.innerHTML=h;
}
function finish(){
  G.fin=true;clearInterval(G.iv);unlock();
  var o=G.opts;
  if(o.onDone)o.onDone();
  var el=$('guide');el.classList.add('fin');el.setAttribute('data-kind','work');
  $('f-title').textContent=o.rest?'Repos terminé':'Bravo '+S.name+' !';
  $('f-sub').textContent=o.msg||'';
  var mins=o.minutes||0;
  $('f-kpis').innerHTML=(o.rest?'':'<div><b>'+G.works+'</b><span>exercices</span></div><div><b>'+mins+'</b><span>minutes</span></div>');
  confetti();SND.song();
  setTimeout(function(){say('Félicitations '+S.name+' ! Séance terminée. Tu es incroyable !')},900);
}
function closeGuide(save2){
  if(G){
    clearInterval(G.iv);
    if(!G.fin&&G.opts.pctKey&&G.works){var p=G.doneWorks/G.works;if(p>(S.pct[G.opts.pctKey]||0)){S.pct[G.opts.pctKey]=p;save()}}
    G.fin=true;
  }
  SND.stopSong();try{speechSynthesis.cancel()}catch(e){}clearTimeout(sayT);
  unlock();$('guide').hidden=true;document.body.style.overflow='';
}

/* ================= Actions ================= */
var H={
  tab:function(el){V.tab=el.getAttribute('data-tab');V.confirm=false;render();window.scrollTo(0,0)},
  sel:function(el){V.sel=el.getAttribute('data-k');render()},
  goday:function(el){V.sel=el.getAttribute('data-k');V.tab='today';render();window.scrollTo(0,0)},
  theme:function(){S.theme=S.theme==='light'?'dark':'light';applyTheme();save()},
  start:function(){
    var k=V.sel,plan=dayPlan(parse(k));
    if(plan.type==='cali'){
      runGuide(plan.steps,{minutes:plan.min,msg:'Belle séance. Marche un peu et bois de l\'eau.',pctKey:k,onDone:function(){S.done[k]=true;S.pct[k]=1;save()}});
    }else if(plan.type==='gym'){
      runGuide(gymSteps(plan.ph,k),{minutes:plan.min,msg:'Première étape franchie. Repose-toi bien.',pctKey:k,onDone:function(){S.done[k]=true;save()}});
    }
  },
  undo:function(){delete S.done[V.sel];delete S.pct[V.sel];save();render()},
  walk:function(){S.done[V.sel]=true;save();render();toast('Marche enregistrée')},
  finishgym:function(){S.done[V.sel]=true;save();render();toast('Séance enregistrée, bravo !')},
  set:function(el){var g=gs(V.sel),b=el.getAttribute('data-k');g.s[b]=!g.s[b];save();render()},
  gclose:function(){closeGuide();render()},
  gclose2:function(){closeGuide();render()},
  gstats:function(){closeGuide();V.tab='stats';render();window.scrollTo(0,0)},
  gvoice:function(el){S.voice=!S.voice;save();el.setAttribute('aria-pressed',S.voice);if(!S.voice){try{speechSynthesis.cancel()}catch(e){}}},
  gsound:function(el){S.sound=!S.sound;save();el.setAttribute('aria-pressed',S.sound);if(!S.sound)SND.stopSong()},
  gpause:function(el){
    if(!G||G.fin)return;
    if(G.paused){G.paused=false;G.end=Date.now()+G.rem;el.textContent='Pause'}
    else{G.paused=true;G.rem=G.end-Date.now();el.textContent='Reprendre'}
  },
  gnext:function(){if(G&&!G.fin)completeStep()},
  gskip:function(){if(G&&!G.fin){$('g-pp').textContent='Pause';G.paused=false;next()}},
  gprev:function(){if(G&&!G.fin){$('g-pp').textContent='Pause';G.paused=false;enter(Math.max(0,G.i-1))}},
  tvoice:function(el){S.voice=!S.voice;save();el.setAttribute('aria-checked',S.voice)},
  tsound:function(el){S.sound=!S.sound;save();el.setAttribute('aria-checked',S.sound)},
  testvoice:function(){var n=S.name||'champion';var v=S.voice;S.voice=true;ctx();SND.chime();say('Bravo '+n+' ! Tu assures !');S.voice=v;if(!('speechSynthesis' in window))toast('Voix non disponible ici')},
  shift:function(){var d=addDays(parse(S.start),7);S.start=key(d);save();render();toast('Programme décalé au '+long(d))},
  reset:function(){if(!V.confirm){V.confirm=true;render();return}S.done={};S.gym={};S.pct={};V.confirm=false;save();render();toast('Progression effacée')}
};
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;if(!el)return;
  var a=el.getAttribute('data-act');if(H[a])H[a](el,e);
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='sd'&&t.value){S.start=t.value;save();render();toast('Date de départ mise à jour')}
  if(t.id==='nm'){S.name=(t.value||'').trim()||'champion';save()}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden){renderHeader();if(G&&!G.fin&&!G.paused)lock()}});

var vs=$('g-voice'),ss=$('g-sound');vs.setAttribute('aria-pressed',S.voice);ss.setAttribute('aria-pressed',S.sound);
applyTheme();
render();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
setTimeout(function(){var sp=$('splash');if(sp&&sp.parentNode)sp.parentNode.removeChild(sp)},2200);
})();
</script>
</body>
</html>
